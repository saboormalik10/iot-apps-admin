services:
  - type: web
    name: observator-backend
    env: docker
    region: oregon
    plan: free
    branch: main
    # Dockerfile is at repo root; COPY paths inside it reference backend/
    healthCheckPath: /health

    # Auto-deploy on push to main
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      # MongoDB Atlas — set this in Render Dashboard → Environment
      - key: MONGO_URI
        sync: false           # Do NOT commit the real URI; set it in Render UI

      # JWT secrets — set in Render Dashboard
      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      # API base URL — Render assigns this automatically; override if using custom domain
      - key: API_BASE_URL
        sync: false           # e.g. https://observator-backend.onrender.com

      # Swagger docs password gate (HTTP Basic Auth) — /api returns 503 without these
      - key: SWAGGER_USER
        sync: false
      - key: SWAGGER_PASSWORD
        sync: false

      # CORS allow-list (Month 5) — comma-separated dashboard origin(s)
      - key: CORS_ORIGIN
        sync: false           # e.g. https://dashboard.observator.com

      # Sentry crash reporting (Month 5) — optional
      - key: SENTRY_DSN
        sync: false

      # Public share links (Month 6) — base URL for /public/:token links
      - key: PUBLIC_SHARE_BASE_URL
        sync: false           # e.g. https://dashboard.observator.com

      # Push notifications (Month 6) — optional; WebSocket delivery works without these
      - key: PUSH_ONESIGNAL_APP_ID
        sync: false
      - key: PUSH_ONESIGNAL_API_KEY
        sync: false

      # Nodemailer — Gmail SMTP
      - key: EMAIL_MAILER
        sync: false           # saboordev8@gmail.com

      - key: EMAIL_PASSWORD
        sync: false           # Gmail App Password

      - key: EMAIL_FROM
        value: Observator <noreply@observator.com>

      # Mobile static API key — hardcode in MET-LINK and NEP-LINK apps
      - key: MOBILE_API_KEY
        sync: false           # obs_mob_...

      - key: MOBILE_ORG_ID
        sync: false           # ObjectId of the organisation in Atlas
