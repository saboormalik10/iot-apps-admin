name: CI

on:
  push:
    branches: [main, 'Month-*']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://localhost:27017/observator_ci
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      SWAGGER_USER: docs
      SWAGGER_PASSWORD: ci_docs
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The repo's eslint config predates ESLint v10's flat config, so lint is
      # currently non-blocking. Build + tests are the merge gate.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build (TypeScript strict)
        run: npm run build

      - name: Seed database
        run: npm run seed

      - name: Test (e2e + unit)
        run: npm test
